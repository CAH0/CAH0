name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Запускается каждый день в полночь
  workflow_dispatch:     # Позволяет запустить вручную из вкладки Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # Даём разрешение сохранять файлы в репозиторий

    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output  # Файлы сохранятся в отдельную ветку 'output'
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
